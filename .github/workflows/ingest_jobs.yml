name: Ingest Jobs (Production)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: production-ingestion
  cancel-in-progress: false

jobs:
  ingest-jobs:
    name: Ingest Target ATS Jobs
    runs-on: ubuntu-latest
    # A full pass over every target (some boards list thousands of postings) can exceed an hour; the six-hour
    # schedule and the concurrency group above prevent overlapping runs.
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest Direct ATS Targets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m ingestion.cli --all

name: CI

# Pushes are validated only on main; every other branch is validated once, through its pull request.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roleradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: roleradar
      TESTING: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Create schema and apply migrations
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql -v ON_ERROR_STOP=1 -f db/schema.sql
          python -m db.migrate

      - name: Run backend tests
        run: python -m pytest -q -rs --junitxml=pytest-report.xml

      # Database-dependent tests skip themselves when PostgreSQL or a migration is missing. That must never
      # look green in CI, so any skipped test at all fails the job (there are no intentional skips).
      - name: Fail if any test was skipped
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("pytest-report.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = [
              f"{case.get('classname')}::{case.get('name')}: {(case.find('skipped').get('message') or '')[:120]}"
              for case in root.iter("testcase") if case.find("skipped") is not None
          ]
          print(f"pytest ran {tests} tests, {len(skipped)} skipped")
          if tests == 0 or skipped:
              print("::error title=Skipped tests::" + ("no tests ran" if tests == 0 else f"{len(skipped)} test(s) were skipped"))
              for line in skipped:
                  print("  SKIPPED", line)
              sys.exit(1)
          PY

  frontend:
    name: Frontend (tests, lint, types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Production build
        run: npm run build

  whitespace:
    name: Whitespace check (git diff --check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed lines for whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          git diff --check "$BASE_SHA" HEAD
